server:
  listen: "0.0.0.0:9445"

# No tls: or auth: sections — EnsurePKI() with Step CA handles certificate
# generation and JWT key setup automatically.

feature_flags:
  provider_fallbacks: true

sessions:
  max_per_project: 5
  max_global: 20
  idle_timeout: "30m"
  stop_grace_period: "10s"
  event_buffer_size: 8388608

input:
  max_size_bytes: 65536

rate_limits:
  global_rps: 50
  global_burst: 100
  start_session_per_client_rps: 1
  start_session_per_client_burst: 3
  send_input_per_session_rps: 5
  send_input_per_session_burst: 20

providers:
  claude:
    binary: "./node_modules/@anthropic-ai/claude-code/bin/claude.exe"
    args: ["--verbose"]
    startup_timeout: "60s"
    validate_startup: false
    startup_probe: "prompt"
    required_env: ["CLAUDE_CODE_OAUTH_TOKEN"]
    fallbacks: ["codex"]
    prompt_pattern: "(?m)(❯|>\\s*$)"
  opencode:
    binary: "./node_modules/opencode-ai/bin/opencode.exe"
    args: []
    startup_timeout: "45s"
    validate_startup: false
    startup_probe: "output"
    required_env: ["OPENAI_API_KEY"]
    fallbacks: ["codex"]
    prompt_pattern: "❯"
  codex:
    binary: "node"
    args: ["./node_modules/@openai/codex/bin/codex.js"]
    startup_timeout: "60s"
    validate_startup: false
    startup_probe: "output"
    prompt_pattern: "(?m)(>\\s*$|›)"
  gemini:
    binary: "agy"
    args: []
    startup_timeout: "60s"
    validate_startup: false
    startup_probe: "output"
    prompt_pattern: "^\\s*>\\s*$"

allowed_paths:
  - "/repos"

logging:
  level: "info"
  format: "json"
  redact_patterns:
    - "(?i)(api[_-]?key|token|secret|password)\\s*[:=]\\s*\\S+"
