services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BRIDGE_CONFIG: /app/config/bridge-docker.yaml
      BRIDGE_CN: bridge.local
      BRIDGE_SANS: bridge.local,localhost,127.0.0.1
      BRIDGE_CLIENT_CN: dev-client
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "9445:9445"
    volumes:
      - ./certs:/app/certs
      - ./config/bridge-docker.yaml:/app/config/bridge-docker.yaml:ro
      - ${HOME}/repos:/repos
      - ${HOME}/.gemini/oauth_creds.json:/home/bridge/.gemini/oauth_creds.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9445'"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 30s
    networks:
      default:
        aliases:
          - bridge.local

  web:
    build:
      context: .
      dockerfile: examples/web/Dockerfile
      target: production
    environment:
      BRIDGE_ADDR: bridge.local:9445
      BRIDGE_SERVER_NAME: bridge.local
      CA_CERT: /certs/ca-bundle.crt
      CLIENT_CERT: /certs/dev-client.crt
      CLIENT_KEY: /certs/dev-client.key
      JWT_KEY: /certs/jwt-signing.key
      JWT_ISSUER: dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      bridge:
        condition: service_healthy
    networks:
      default:
        aliases:
          - web.local
