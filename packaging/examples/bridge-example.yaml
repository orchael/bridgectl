# bridge-example.yaml — example bridgectl configuration profile.
#
# Copy this file to /etc/bridgectl/bridge.yaml, uncomment the providers
# you want to enable, and supply credentials via your shell environment or a
# ~/.config/bridgectl/agents.env file sourced by the user service.
#
# This profile:
#   - binds to 127.0.0.1:9445 in SECURE mode (mTLS + JWT via auto-generated PKI)
#   - persistence is disabled by default; uncomment db_path to enable it
#   - resolves provider CLIs from the user-owned provider runtime root
#
# SECURITY MODES:
#   - No server.listen (unix socket): local-only, no authentication required.
#   - server.listen set (TCP): always uses mTLS + JWT. When tls.ca_bundle/cert/key
#     are empty the server auto-generates PKI material in ~/.config/bridgectl/certs/
#     on first start. Supply explicit paths only when integrating with an external CA
#     (e.g. Step CA). Do not expose the TCP port to the public internet; use
#     WireGuard or Tailscale for remote access.

server:
  listen: "127.0.0.1:9445"

# TLS: leave empty to use auto-generated PKI (self-signed CA + server cert).
# Set all three paths when using an external CA such as Step CA.
tls:
  ca_bundle: ""
  cert: ""
  key: ""

# JWT: leave jwt_public_keys empty when using auto-PKI (the server issues its
# own client tokens). Add entries when consumer projects bring their own Ed25519
# signing keys (e.g. prd-manager or ndara-orchestrator).
auth:
  jwt_public_keys: []
  jwt_audience: "bridge"
  jwt_max_ttl: "5m"

feature_flags:
  provider_fallbacks: true

sessions:
  max_per_project: 5
  max_global: 20
  idle_timeout: "30m"
  stop_grace_period: "10s"
  event_buffer_size: 10000
  max_subscribers_per_session: 10
  subscriber_ttl: "30m"

input:
  max_size_bytes: 65536

rate_limits:
  global_rps: 50
  global_burst: 100
  start_session_per_client_rps: 1
  start_session_per_client_burst: 3
  send_input_per_session_rps: 5
  send_input_per_session_burst: 20

persistence:
  # db_path: "/home/youruser/.config/bridgectl/sessions.db"
  # Use an absolute path; ~ is not expanded. Omit to disable persistence.

runtime:
  provider_root: "$HOME/.local/share/bridgectl/providers"

repo_setup:
  enabled: true
  config_path: ".bridgectl.yaml"
  default_timeout: "2m"
  max_timeout: "15m"

# Enable one or more providers below. Credentials are read from the environment
# (injected via /etc/bridgectl/agents.env at service startup).
#
# Run /usr/lib/bridgectl/install-provider-runtime as the bridge login user
# to install the CLIs before enabling any provider here.

providers:

# Uncomment to enable Codex (requires OPENAI_API_KEY in agents.env):
#
#   codex:
#     binary: "/usr/bin/node"
#     args: ["./node_modules/@openai/codex/bin/codex.js"]
#     startup_timeout: "60s"
#     startup_probe: "output"
#     required_env: ["OPENAI_API_KEY"]
#     prompt_pattern: '(?m)(>\s*$|›)'

# Uncomment to enable Claude Code (requires CLAUDE_CODE_OAUTH_TOKEN in agents.env):
#
#   claude:
#     binary: "./node_modules/@anthropic-ai/claude-code/bin/claude.exe"
#     args: []
#     startup_timeout: "60s"
#     startup_probe: "output"
#     required_env: ["CLAUDE_CODE_OAUTH_TOKEN"]
#     prompt_pattern: '(?m)(❯|>\s*$)'

# Uncomment to enable OpenCode (requires OPENAI_API_KEY or CLAUDE_CODE_OAUTH_TOKEN):
# OpenCode ships as a native binary installed via npm — no Node.js invocation needed.
#
#   opencode:
#     binary: "./node_modules/.bin/opencode"
#     args: []
#     startup_timeout: "45s"
#     startup_probe: "output"

# Uncomment to enable Antigravity CLI (agy) for Gemini.
# Auth uses OAuth2 credentials at ~/.gemini/oauth_creds.json (no API key needed).
# Install agy: curl -fsSL https://antigravity.google/cli/install.sh | bash
#
#   gemini:
#     binary: "agy"
#     args: []
#     startup_timeout: "60s"
#     startup_probe: "output"

allowed_paths:
  - "/home"
  - "/srv"
  - "/tmp"
  - "/var/tmp"

logging:
  level: "info"
  format: "json"
  redact_patterns:
    - '(?i)(api[_-]?key|token|secret|password)\s*[:=]\s*\S+'
