services:
  bridge:
    image: bridgectl-e2e
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        INCLUDE_E2E_SCRIPTS: "true"
    environment:
      BRIDGE_CONFIG: /app/config/bridge-e2e.yaml
      BRIDGE_CN: bridge
      BRIDGE_CLIENT_CN: e2e-client
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - certs:/app/certs
      - repos:/tmp/bridgectl
      - bridge-state:/home/bridge/.config/bridgectl
      - ./bridge-e2e.yaml:/app/config/bridge-e2e.yaml:ro
    depends_on:
      telemetry-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9445'"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 30s

  telemetry-collector:
    # Exercise the production collector image and its non-root USER. Docker
    # initializes a new named volume from the image's collector-owned /data.
    image: bridgectl-telemetry-e2e
    build:
      context: ..
      dockerfile: telemetry/Dockerfile
    command:
      - "--listen"
      - "0.0.0.0:9464"
      - "--spool-dir"
      - "/data/segments"
      - "--kinds"
      - "all"
      - "--max-segment-bytes"
      - "1048576"
      - "--max-disk-space"
      - "3MiB"
    volumes:
      - telemetry:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/bridgectl", "telemetry", "health", "--target", "127.0.0.1:9464", "--insecure"]
      interval: 2s
      timeout: 2s
      retries: 20

  test-client:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.client
    environment:
      E2E_ONLY: ${E2E_ONLY:-}
      E2E_TEST_TIMEOUT: ${E2E_TEST_TIMEOUT:-}
      E2E_UNPROTECTED_EXPECT: ${E2E_UNPROTECTED_EXPECT:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      bridge:
        condition: service_healthy
    volumes:
      - certs:/certs:ro
      - repos:/tmp/bridgectl
      - telemetry:/telemetry:ro
      - test-results:/results

volumes:
  bridge-state:
  certs:
  repos:
  telemetry:
  test-results:
