services:
  bridge:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        INCLUDE_E2E_SCRIPTS: "true"
    environment:
      BRIDGE_CONFIG: /app/config/bridge-e2e.yaml
      BRIDGE_CN: bridge
      BRIDGE_CLIENT_CN: e2e-client
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - certs:/app/certs
      - repos:/tmp/bridgectl
      - ./bridge-e2e.yaml:/app/config/bridge-e2e.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9445'"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 30s

  test-client:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.client
    environment:
      E2E_ONLY: ${E2E_ONLY:-}
      E2E_TEST_TIMEOUT: ${E2E_TEST_TIMEOUT:-}
      E2E_UNPROTECTED_EXPECT: ${E2E_UNPROTECTED_EXPECT:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      bridge:
        condition: service_healthy
    volumes:
      - certs:/certs:ro
      - repos:/tmp/bridgectl
      - test-results:/results

volumes:
  certs:
  repos:
  test-results:
